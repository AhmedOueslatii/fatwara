name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps for lxml + cryptography
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev libssl-dev libffi-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          TEIF_SCHEMA_VERSION: "1.8.7"
          DATABASE_URL: "postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder"
          JWT_SECRET: "ci-placeholder"
        run: pytest tests/ -v --tb=short
